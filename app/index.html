<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f2" />
    <meta name="description" content="Создавай и делись рейтингами воспоминаний из Love and Deepspace." />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/cardrank-icon-rounded-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/cardrank-icon-rounded-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/cardrank-icon-rounded-180.png" />
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem('cardrank-state-v1') || 'null');
          const theme = saved?.themePreference;
          const language = saved?.languagePreference;
          document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
            ? theme
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.lang = language === 'ru' || language === 'en'
            ? language
            : (navigator.language.toLowerCase().startsWith('ru') ? 'ru' : 'en');
        } catch {}
      })();
    </script>
    <title>LoveAndRanking — рейтинги воспоминаний Love and Deepspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
